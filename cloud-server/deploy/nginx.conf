# TLS-terminating reverse proxy for the HVAC Cloud Server.
#
# Architecture: the app runs as plain HTTP on localhost; Nginx terminates TLS
# and forwards to it. So bind uvicorn to localhost only:
#     uvicorn app:app --host 127.0.0.1 --port 8002 --workers 4
# (On AWS you can instead terminate TLS at an ALB with an ACM cert and skip
#  Nginx entirely — point the ALB target group at the instances' :8002.)
#
# Get a cert with certbot:  sudo certbot --nginx -d api.yourdomain.com
#
# Then the phone app's cloud URL and the gateway's PROVISION `cloud` field both
# become  https://api.yourdomain.com  (no port).

server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;        # force HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;                       # readings/JSON are tiny

    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
